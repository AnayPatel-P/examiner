[project]
name = "examiner"
version = "0.1.0"
description = "Compliance eval harness for banking chatbots"
readme = "README.md"
authors = [
    { name = "Anay Patel", email = "anay.patel1118@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "fastapi>=0.165.0",
    "inspect-ai>=0.3.291",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
examiner = "examiner.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# typer.Option(...) defaults are the Typer idiom
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
