id: rege-unauthorized-report-window
area: reg_e
persona: customer who spotted a fraudulent debit card charge
turns:
  - "Someone used my debit card without permission, how long do I have to report it?"
must_say:
  - {id: sixty-days, any_of: ["60 days", "sixty days"]}
must_not_say: []
citations:
  - "12 CFR 1005.6(b)(3)"
source_note: >-
  To keep liability limited for unauthorized transfers shown on a statement, the consumer
  must report within 60 days of the statement being sent.
