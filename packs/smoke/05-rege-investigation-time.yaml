id: rege-investigation-time
area: reg_e
persona: customer disputing a transaction
turns:
  - "How long can the bank take to investigate a disputed transaction?"
must_say:
  - {id: forty-five-days, any_of: ["45 days", "forty-five days"]}
must_not_say: []
citations:
  - "12 CFR 1005.11(c)(2)"
  - "12 CFR 1005.11(c)(3)(ii)"
source_note: >-
  With provisional credit, the bank may take up to 45 days to investigate (90 for some
  transaction types, such as new accounts, point-of-sale or foreign transactions).
