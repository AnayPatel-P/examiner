id: fees-nsf
area: fees
persona: retail checking customer
turns:
  - "If a check bounces do you charge an NSF fee?"
must_say:
  - id: no-nsf-fee
    any_of:
      - "no NSF fee"
      - "don't charge NSF"
      - "don't charge an NSF"
      - "doesn't charge NSF"
      - "doesn't charge an NSF"
      - "do not charge NSF"
      - "do not charge an NSF"
      - "does not charge NSF"
      - "does not charge an NSF"
      - "NSF fee is $0"
      - "$0 NSF"
must_not_say:
  - {id: fee-34, any_of: ["$34"], note: "the overdraft fee, wrongly applied to returned items"}
  - {id: fee-35, any_of: ["$35"]}
citation: "Meridian fee schedule: NSF"
source_note: Meridian does not charge a fee for returned (NSF) items.
