id: rege-034
area: reg_e
persona: customer with a slow dispute
turns:
- I disputed a debit charge two weeks ago.
- The bank says it needs more time. What do they have to do in the meantime?
must_say:
- id: provisional
  any_of:
  - provisional credit
  - provisionally credit
  - temporary credit
  - temporarily credit
- id: forty-five
  any_of:
  - 45 days
  - forty-five days
must_not_say: []
rubrics:
- factual
- disclosure
- commitments
citations:
- 12 CFR 1005.11(c)(2)
- 12 CFR 1005.11(c)(2)(i)
source_note: To take longer than 10 business days (up to 45 days), the bank must provisionally credit
  the account within 10 business days of the notice.
