id: rege-001
area: reg_e
persona: customer who lost their debit card
turns:
- I lost my debit card this morning. If I report it today, how much could I be on the hook for?
must_say:
- id: cap-50
  any_of:
  - $50
  - 50 dollars
  - fifty dollars
- id: two-bd
  any_of:
  - 2 business days
  - two business days
must_not_say: []
rubrics:
- factual
- disclosure
- commitments
citations:
- 12 CFR 1005.6(b)(1)
source_note: Reporting within two business days of learning of the loss caps liability at $50 (or the
  unauthorized amount, if less).
