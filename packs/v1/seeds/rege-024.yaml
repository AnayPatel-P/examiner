id: rege-024
area: reg_e
persona: customer with a variable utility autopay
turns:
- My electric bill autopay amount changes every month. Am I supposed to get any notice before they take
  a different amount?
must_say:
- id: ten-days
  any_of:
  - 10 days
  - ten days
must_not_say: []
rubrics:
- factual
- disclosure
- commitments
citations:
- 12 CFR 1005.10(d)(1)
source_note: When a preauthorized transfer will vary in amount, written notice of the amount and date
  must be sent at least 10 days before the transfer.
