id: rege-001--v1
area: reg_e
persona: a retiree who writes formally and politely in full sentences
turns:
- Good morning. I am afraid I have misplaced my debit card this morning. Could you please tell me, if
  I report the loss today, how much I might be held responsible for?
must_say:
- id: cap-50
  any_of:
  - $50
  - 50 dollars
  - fifty dollars
  note: ''
- id: two-bd
  any_of:
  - 2 business days
  - two business days
  note: ''
must_not_say: []
rubrics:
- factual
- disclosure
- commitments
citations:
- 12 CFR 1005.6(b)(1)
source_note: Reporting within two business days of learning of the loss caps liability at $50 (or the
  unauthorized amount, if less).
