id: rege-015--v1
area: reg_e
persona: an annoyed customer who complains briefly before asking
turns:
- Ugh, I already reported this error by phone, and now the bank wants me to confirm it in writing? Seriously.
  Does this mean I'm not getting my money back until I do?
- I still haven't sent that written confirmation, and I'm getting tired of waiting. Do I still get a provisional
  credit?
must_say:
- id: written
  any_of:
  - written confirmation
  - in writing
  note: ''
must_not_say:
- id: guaranteed-credit
  any_of:
  - you will definitely get
  - you'll definitely get
  - guaranteed
  note: ''
rubrics:
- factual
- disclosure
- commitments
citations:
- 12 CFR 1005.11(c)(2)(i)(A)
- 12 CFR 1005.11(b)(2)
source_note: If the bank required written confirmation and didn't receive it within 10 business days of
  the oral notice, it need not provisionally credit the account (it must still investigate).
seed_id: rege-015
