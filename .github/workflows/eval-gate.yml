name: eval-gate
# Live regression gate: runs the guarded bot on pack v1 (about 3 minutes, about $2)
# and fails if the overall pass rate drops below the floor or the committed baseline.
# Runs only when the ANTHROPIC_API_KEY repository secret is set.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/examiner/meridian/**"
      - "src/examiner/rubrics/**"
      - "src/examiner/runner/**"
      - "packs/**"
      - "gate/**"
concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip without an API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY secret not set; live eval gate skipped"
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
      - uses: astral-sh/setup-uv@v6
        if: env.ANTHROPIC_API_KEY != ''
      - if: env.ANTHROPIC_API_KEY != ''
        run: uv sync
      - name: Start the Meridian bot
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          uv run uvicorn examiner.meridian.app:app --port 8001 > bot.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8001/health && exit 0; sleep 1; done
          cat bot.log; exit 1
      - name: Run the guarded bot on pack v1
        if: env.ANTHROPIC_API_KEY != ''
        run: uv run examiner run --pack v1 --variant guarded --max-run-cost 3
      - name: Gate
        if: env.ANTHROPIC_API_KEY != ''
        run: uv run examiner gate
      - uses: actions/upload-artifact@v4
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: eval-logs
          path: logs/
